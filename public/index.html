  <title>ChatGPT Win</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0d0d;
      --topbar-bg: #000000;
      --topbar-row-height: 52px;
      --topbar-safe-lift: 0px;
      --manual-safe-area-top: 0px;
      --manual-safe-area-bottom: 0px;
      --native-safe-area-top: 0px;
      --native-safe-area-bottom: 0px;
      --native-keyboard-height: 0px;
      --effective-safe-area-top: calc(max(0px, calc(max(env(safe-area-inset-top), var(--native-safe-area-top)) - var(--topbar-safe-lift))) + var(--manual-safe-area-top));
      --effective-safe-area-bottom: max(env(safe-area-inset-bottom), var(--native-safe-area-bottom));
      --mobile-text-scale: 1;
      --top-control-size: 26px;
      --thread-composer-gap: 6px;
      --thread-menu-edge-gap: 12px;
      --notice-top-gap: 8px;
      --panel: #171717;
      --panel-2: #242424;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --faint: #71717a;
      --line: rgba(255,255,255,.09);
      --user: #2f2f2f;
      --assistant: transparent;
      --accent: #f4f4f5;
      --ok: #8ef0b7;
      --accent-blue: #5eb4ff;
      --accent-blue-soft: #9ecbff;
      --accent-amber: #ffd68a;
      --composer-bg: #202020;
      --app-height: 100dvh;
      --app-top: 0px;
      --keyboard-shift: 0px;
      --keyboard-composer-gap: 0px;
      --keyboard-shift-trim: 15px;
      --keyboard-gap-bg: #0d0d0d;
      --composer-bottom-pad: max(56px, calc(var(--effective-safe-area-bottom) + 30px + var(--manual-safe-area-bottom)));
      --composer-signature-gap: 15px;
      --composer-signature-top: calc(var(--thread-composer-gap) + 64px + var(--composer-signature-gap));
      --signature-dot-tint-a: color(display-p3 .67 .90 .82);
      --signature-dot-tint-b: color(display-p3 .57 .92 .74);
      --signature-dot-glow: rgba(142,240,183,.14);
      --dot-core: color(display-p3 .42 1 .68);
      --dot-glow-soft: color(display-p3 .18 1 .48 / .52);
      --dot-glow-peak: color(display-p3 .56 1 .78);
      --dot-glow-deep: color(display-p3 .08 .9 .36 / .58);
      --dot-hdr-flare: color(display-p3 .64 1 .78 / .98);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, "PingFang SC", sans-serif;
    }
    @media (dynamic-range: high) {
      @supports (dynamic-range-limit: no-limit) {
        :root {
          --dot-core: color(display-p3 .54 1 .72);
          --dot-glow-soft: color(display-p3 .22 1 .50 / .72);
          --dot-glow-peak: color(display-p3 .72 1 .86);
          --dot-glow-deep: color(display-p3 .10 1 .42 / .86);
          --dot-hdr-flare: color(display-p3 .86 1 .92);
        }
        .title-dot { dynamic-range-limit: no-limit; }
      }
    }
    * { box-sizing: border-box; }
    /* 统一微交互过渡：颜色/边框/缩放/透明度 120-200ms 平滑变化 */

    .reasoning-badge.mode-low {

      border-color: rgba(158,203,255,.28);

    }
    .reasoning-badge.mode-medium {

    }

    .prompt-library-title, .prompt-library-text {

    .model-menu-card.is-open { display: grid; }
    .model-menu-item {

    .model-menu-item.is-current::after {

    .reasoning-menu-card {

    }
    .reasoning-menu-item {
      width: 75px;

    }
    .reasoning-menu-item.mode-low {

    }
    .reasoning-menu-item.mode-medium {

    .thread-button {

      .topbar { padding-left: 12px; padding-right: 12px; }
      .topbar > .title,
      .topbar > .top-actions { transform: translateY(var(--topbar-content-lift)); }
      .route-badge { grid-template-columns: 14px auto; padding-inline: 7px 8px; font-size: 11px; gap: 4px; }
      .route-badge.is-compact { width: var(--top-control-size); grid-template-columns: 1fr; gap: 0; padding: 0; }
      .route-badge svg { width: 14px; height: 14px; transform: translateY(.2px); }
      .reasoning-badge,
      .model-badge { min-width: 38px; padding-inline: 8px; font-size: 11px; }
      .reasoning-badge { min-width: 30px; font-size: 10px; }
      .context-status.mode-ring { width: calc(var(--top-control-size) - 2.5px); min-width: calc(var(--top-control-size) - 2.5px); height: calc(var(--top-control-size) - 2.5px); }
      .context-status .context-ring { width: calc(var(--top-control-size) - 2.5px); height: calc(var(--top-control-size) - 2.5px); }
      #route-text { line-height: 14px; transform: translateY(.1px); }
      .thread-button { padding-inline: 5px; }
      .thread-name { max-width: min(48vw, 300px); }
      .new-thread-btn svg { width: 12px; height: 12px; }
      .top-actions {
        flex-basis: min(46vw, 184px);
        width: min(46vw, 184px);
        max-width: calc(100vw - 144px);
        gap: 6px;
      }
      .thread { padding: 18px 12px var(--thread-composer-gap); }
      .bubble-wrap { max-width: 88%; }
      .message.assistant .bubble-wrap { width: 100%; max-width: none; }
      .message.user .bubble-wrap { max-width: 88%; }
      .bubble { font-size: 15px; }
      .composer-shell {
        padding-left: max(var(--thread-menu-edge-gap), calc((100vw - 520px) / 2));
        padding-right: max(var(--thread-menu-edge-gap), calc((100vw - 520px) / 2));
      }
      .composer { border-radius: 29px; }
      .composer-signature { font-size: 18.5px; }
    }

    body.standalone .thread { padding-top: 16px; }
    body.standalone .composer-shell {
      padding-top: 5px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }

    /* ChatGPT mobile-inspired remote workspace */
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --topbar-bg: rgba(255,255,255,.94);
      --panel: #f7f7f7;
      --panel-2: #ededed;
      --text: #111111;
      --muted: #6f6f6f;
      --faint: #969696;
      --line: rgba(0,0,0,.09);
      --user: #f1f1f1;
      --assistant: transparent;
      --accent: #111111;
      --ok: #159455;
      --keyboard-gap-bg: #ffffff;
      --text-strong: #202020;
      --ink: #171717;
      --muted-2: #8a8a8a;
      --muted-3: #777;
      --muted-4: #656565;
      --danger: #b42318;
      --hover-bg: #f2f2f2;
      --composer-bottom-pad: max(14px, calc(var(--effective-safe-area-bottom) + 14px + var(--manual-safe-area-bottom)));
      --thread-composer-gap: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    * { letter-spacing: 0 !important; }
    html, body { background: #fff; color: var(--text); }
    body { -webkit-font-smoothing: antialiased; }
    button, input, textarea { font-family: inherit; letter-spacing: 0; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid #2f80ed;
      outline-offset: 2px;
    }

    .app { background: #fff; grid-template-rows: auto minmax(0, 1fr) auto; }
    .topbar {
      height: calc(62px + var(--effective-safe-area-top));
      padding: var(--effective-safe-area-top) 15px 0;
      border: 0;
      background: var(--topbar-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .title { gap: 0; font-weight: 650; }
    .title-dot, .thread-current-pin { display: none !important; }
    .thread-button {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      width: min(100%, 520px);
      height: 44px;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      border-radius: 6px;
      text-align: left;
    }
    .thread-button:hover { background: var(--panel); }
    .thread-button:active { background: var(--panel-2); transform: none; }
    .menu-glyph {
      width: 27px;
      height: 27px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }
    .thread-name {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
      font-weight: 620;
      line-height: 1.2;
    }
    .top-actions { gap: 7px; overflow: visible; }
    .top-actions > :first-child { margin-left: auto; }
    .top-actions .new-thread-btn,
    .top-actions .cdp-launch-btn { display: none !important; }
    .context-status {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border: 0;
      background: #f5f5f5;
      color: #555;
    }
    .context-status.mode-ring {
      width: 34px;
      min-width: 34px;
      height: 34px;
      border-radius: 50%;
    }
    .context-text { font-size: 9px; font-weight: 650; }
    .route-badge {
      width: 34px;
      min-width: 34px;
      height: 34px;
      grid-template-columns: 1fr;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--accent);
      background: #f5f5f5;
    }
    .route-badge.is-local { color: var(--accent); border: 0; background: #f5f5f5; }
    .route-badge #route-text { display: none; }
    .route-badge svg { width: 17px; height: 17px; }

    .thread-menu-scrim {
      position: fixed;
      inset: 0 !important;
      z-index: 109;
      background: rgba(0,0,0,.31);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .thread-menu {
      display: none;
      position: fixed;
      inset: 0 auto 0 0 !important;
      z-index: 110;
      width: min(84vw, 350px);
      max-width: none;
      max-height: none;
      min-height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      border: 0;
      border-radius: 0;
      background: #fff;
      color: var(--accent);
      box-shadow: 18px 0 50px rgba(0,0,0,.12);
      overflow: hidden;
      flex-direction: column;
      transform: none !important;
    }
    .thread-menu.is-open { display: flex; }
    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      padding: 0 2px 8px 8px;
    }
    .drawer-brand { font-size: 26px; line-height: 1; font-weight: 700; }
    .drawer-close {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #f5f5f5;
      color: #222;
    }
    .drawer-close svg, .drawer-new svg, .drawer-search svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .drawer-close svg { width: 20px; height: 20px; }
    .drawer-new {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      width: 100%;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--accent);
      font-size: 16px;
      font-weight: 590;
      text-align: left;
    }
    .drawer-new:hover, .drawer-new:active { background: #f4f4f4; }
    .drawer-new svg { width: 22px; height: 22px; }
    .drawer-search {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      align-items: center;
      gap: 9px;
      min-height: 42px;
      margin: 4px 4px 12px;
      padding: 0 11px;
      border-radius: 6px;
      background: #f3f3f3;
      color: #696969;
    }
    .drawer-search svg { width: 19px; height: 19px; }
    .drawer-search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--accent);
      font-size: 15px;
    }
    .drawer-search input::placeholder { color: var(--muted-3); }
    .thread-menu-content { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 0 1px 18px; }
    .thread-menu-content::-webkit-scrollbar { width: 0; }
    .drawer-footer {
      appearance: none;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 54px;
      padding: 8px;
      border-right: 0;
      border-bottom: 0;
      border-left: 0;
      border-top: 1px solid #ececec;
      background: transparent;
      color: #565656;
      font: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }
    .drawer-footer:hover,
    .drawer-footer:active { background: #f4f4f4; }
    .drawer-footer-main {
      min-width: 0;
      display: grid;
      gap: 2px;
      line-height: 1.25;
    }
    .drawer-footer-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #3f3f3f;
      font-weight: 520;
    }
    .drawer-footer-detail {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted-2);
      font-size: 11px;
    }
    .drawer-avatar {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
    }
    .drawer-footer.is-connecting .drawer-avatar { background: #8a6d1f; }
    .drawer-footer.is-offline .drawer-avatar { background: #8b1d1d; }
    .drawer-account-menu {
      display: none;
      gap: 2px;
      margin: 0 0 10px;
      padding: 10px;
      border: 1px solid #dfe5ea;
      border-radius: 12px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
    }
    .drawer-account-menu.is-open { display: grid; }
    .drawer-account-title {
      padding: 4px 6px 8px;
      color: #333;
      font-size: 13px;
      font-weight: 610;
      line-height: 1.3;
      border-bottom: 1px solid #ececec;
      margin-bottom: 3px;
    }
    .drawer-account-item {
      width: 100%;
      min-height: 40px;
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      padding: 0 7px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #222;
      font: inherit;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }
    .drawer-account-item:hover,
    .drawer-account-item:active { background: var(--hover-bg); }
    .drawer-account-item svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .drawer-account-shortcut { color: var(--muted-2); font-size: 12px; }
    .thread-section + .thread-section { margin-top: 16px; padding-top: 0; border: 0; }
    .thread-section-label { padding: 3px 10px 7px; color: var(--muted-3); font-size: 12px; font-weight: 600; text-transform: none; }
    .project-group + .project-group { margin-top: 3px; }
    .project-header,
    .thread-option,
    .pinned-thread-option {
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
    }
    .project-header { min-height: 42px; padding: 0 9px; }
    .project-header:hover, .project-header:active,
    .thread-option:hover, .thread-option:active,
    .pinned-thread-option:hover, .pinned-thread-option:active { background: #f3f3f3; }
    .project-header.is-current { color: var(--accent); font-weight: 650; }
    .project-folder, .project-header.is-current .project-folder { color: #333; }
    .project-header small, .thread-option-state, .pinned-thread-meta { color: var(--muted-2); }
    .thread-option { min-height: 40px; padding: 0 9px 0 38px; }
    .thread-option.is-conversation { padding-left: 10px; }
    .thread-option[aria-current="true"], .pinned-thread-option[aria-current="true"] { background: #ececec; }
    .thread-option.is-pinned { color: var(--accent); }
    .thread-option-title, .pinned-thread-name { font-size: 14px; font-weight: 510; }
    .pinned-thread-option { min-height: 40px; padding: 0 9px; }
    .thread-title-pin, .pinned-thread-icon { color: #676767; }

    .day-note { display: none; }
    .thread {
      padding: 22px max(18px, calc((100vw - 830px) / 2)) 28px;
      background: #fff;
      color: #161616;
      scroll-padding-bottom: 150px;
      scrollbar-width: none;
    }
    .thread::-webkit-scrollbar { display: none; }
    .message { margin: 0 0 24px; }
    .bubble-wrap { max-width: min(760px, 88%); }
    .message.assistant .bubble-wrap { width: 100%; max-width: 760px; }
    .message.user .bubble-wrap { max-width: min(680px, 82%); }
    .meta {
      margin: 0 2px 7px;
      color: #858585;
      font-size: 12px;
      font-weight: 520;
      line-height: 1.35;
    }
    .bubble {
      color: #1b1b1b;
      font-size: 16px;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }
    .message.user .bubble {
      padding: 10px 15px;
      border: 0;
      border-radius: 18px;
      background: #f1f1f1;
      color: #161616;
      box-shadow: none;
    }
    .message.assistant .bubble { padding: 0 2px; background: transparent; }
    .markdown-body pre, .markdown-body code { border-color: #e1e1e1; background: #f6f6f6; color: #222; }
    .markdown-body a { color: #1769c2; }
    .message.pending .meta { color: #676767; }
    .process-feed { display: grid; gap: 9px; }
    .process-status-line { color: var(--muted-4); font-size: 14px; line-height: 1.5; }
    .process-activity {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 8px;
      border-radius: 50%;
      background: #333;
      animation: processPulse 1.2s ease-in-out infinite;
    }
    @keyframes processPulse { 50% { opacity: .3; transform: scale(.82); } }
    .process-tools {
      width: fit-content;
      max-width: 100%;
      color: #5f5f5f;
      font-size: 13px;
    }
    .process-tools summary { cursor: pointer; list-style: none; padding: 5px 0; }
    .process-tools summary::-webkit-details-marker { display: none; }
    .process-tools summary::before { content: "›"; display: inline-block; margin-right: 7px; transition: transform .16s ease; }
    .process-tools[open] summary::before { transform: rotate(90deg); }
    .process-tools ul { display: grid; gap: 5px; margin: 3px 0 0 21px; padding: 0; list-style: none; color: #858585; }
    details.process { margin-top: 12px; color: var(--muted-3); font-size: 12px; }
    details.process summary { cursor: pointer; }
    .process-more { color: #666; }
    .process-more:hover { color: #222; }

    .notice-pill {
      top: calc(64px + var(--effective-safe-area-top));
      border: 1px solid #e8e8e8;
      background: rgba(255,255,255,.96);
      color: #444;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }
    .notice-pill.error { border-color: #f0cccc; background: #fff7f7; color: var(--danger); }

    body.approval-open { overflow: hidden; }
    .approval-scrim {
      position: fixed;
      z-index: 190;
      inset: 0;
      background: rgba(0,0,0,.34);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    .approval-sheet {
      position: fixed;
      z-index: 200;
      left: 50%;
      bottom: max(12px, calc(env(safe-area-inset-bottom) + 8px));
      display: grid;
      width: min(520px, calc(100vw - 24px));
      max-height: min(78dvh, 680px);
      padding: 18px;
      border: 1px solid #dfdfdf;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 20px 52px rgba(0,0,0,.22);
      transform: translateX(-50%);
      overflow: hidden;
    }
    .approval-sheet[hidden], .approval-scrim[hidden] { display: none; }
    .approval-heading { display: grid; gap: 5px; padding: 0 1px 12px; }
    .approval-heading h2 { margin: 0; color: var(--ink); font-size: 19px; font-weight: 680; line-height: 1.3; }
    .approval-heading p { max-height: 96px; margin: 0; overflow: auto; color: #666; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
    .approval-details {
      display: grid;
      min-height: 0;
      max-height: min(42dvh, 360px);
      overflow: auto;
      border-top: 1px solid var(--panel-2);
      border-bottom: 1px solid var(--panel-2);
    }
    .approval-detail { display: grid; gap: 4px; padding: 11px 1px; }
    .approval-detail + .approval-detail { border-top: 1px solid #f0f0f0; }
    .approval-detail-label { color: var(--muted-3); font-size: 12px; font-weight: 590; line-height: 1.35; }
    .approval-detail-value {
      max-height: 176px;
      overflow: auto;
      color: #252525;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .approval-queue {
      min-height: 18px;
      margin: 10px 1px 0;
      color: var(--muted-3);
      font-size: 12px;
      line-height: 1.4;
    }
    .approval-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
      gap: 8px;
      padding-top: 13px;
    }
    .approval-actions button {
      min-width: 0;
      min-height: 46px;
      padding: 8px 10px;
      border: 1px solid #dddddd;
      border-radius: 7px;
      background: #fff;
      color: #292929;
      font-size: 14px;
      font-weight: 620;
      line-height: 1.25;
    }
    .approval-actions button:hover { background: var(--panel); }
    .approval-actions button:active { background: #efefef; transform: none; }
    .approval-actions .approval-once { background: var(--hover-bg); border-color: var(--panel-2); }
    .approval-actions .approval-session { border-color: var(--accent); background: var(--accent); color: #fff; }
    .approval-actions .approval-session:hover { background: #2a2a2a; }
    .approval-actions .approval-decline { color: var(--danger); border-color: #efcfcc; }
    .approval-actions button:disabled { opacity: .55; cursor: wait; }

    .composer-shell {
      position: relative;
      padding: 5px max(14px, calc((100vw - 780px) / 2)) max(14px, env(safe-area-inset-bottom));
      background: linear-gradient(to bottom, rgba(255,255,255,0), #fff 22px);
    }
    .composer-modes {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 25px;
      padding: 0 10px 5px;
    }
    .model-badge, .reasoning-badge {
      min-width: 0;
      width: auto;
      height: 24px;
      padding: 0 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #6f6f6f;
      font-size: 11px;
      font-weight: 560;
    }
    .model-badge::before { content: "模型 "; color: #999; }
    .reasoning-badge::before { content: "推理 "; color: #999; }
    body[data-ui-language="en"] .model-badge::before { content: "Model "; }
    body[data-ui-language="en"] .reasoning-badge::before { content: "Reasoning "; }
    .model-badge:hover, .reasoning-badge:hover { background: var(--hover-bg); }
    .model-badge.is-official,
    .reasoning-badge.mode-low,
    .reasoning-badge.mode-medium,
    .reasoning-badge.mode-high,
    .reasoning-badge.mode-xhigh,
    .reasoning-badge.mode-max,
    .reasoning-badge.mode-ultra { border: 0; background: transparent; color: #555; }
    .composer {
      min-height: 58px;
      padding: 7px 8px 7px 9px;
      border: 1px solid #e6e6e6;
      border-radius: 29px;
      background: #fff;
      box-shadow: 0 10px 34px rgba(0,0,0,.10);
    }
    .composer textarea {
      min-height: 42px;
      padding: 10px 6px;
      color: var(--ink);
      font-size: 16px;
      line-height: 22px;
    }
    .composer textarea::placeholder { color: #8c8c8c; }
    .composer textarea:focus-visible { outline: 0; }
    .composer:focus-within { border-color: #d7d7d7; }
    .icon-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--accent);
      font-size: 31px;
      font-weight: 300;
    }
    .icon-btn:hover { background: var(--hover-bg); }
    .send-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 23px;
      box-shadow: none;
    }
    .send-btn:disabled { background: #bdbdbd; }
    .icon-btn svg, .send-btn svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

      .workspace { grid-column: 1; grid-row: 2; }

    @media (max-width: 899px) {
      .workspace-content { padding: 26px 16px 34px; }
      .workspace-heading { margin-bottom: 22px; }
      .workspace-heading h1 { font-size: 23px; }
      .workspace-plugin-controls { display: grid; gap: 14px; margin-bottom: 28px; }
      .workspace-plugin-search { width: 100%; }
      .workspace-settings-grid { grid-template-columns: 1fr; gap: 22px; }
      .settings-category-list { position: static; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
      .settings-group-tabs { margin-bottom: 8px; }
      .settings-category-group { grid-column: 1 / -1; margin-top: 13px; }
      .settings-category-item { min-height: 38px; padding: 0 9px; font-size: 13px; }
      .workspace-row { min-height: 62px; }
      .workspace-row-meta { max-width: 116px; }
      .workspace-form-grid { grid-template-columns: 1fr; }

      .workspace-schedule-row .workspace-row-meta { grid-column: 1; grid-row: 2; max-width: none; text-align: left; }
      .workspace-plugin-row { grid-template-columns: 8px minmax(0, 1fr); }

    function applyViewportSize() {
      const viewport = window.visualViewport;
      const viewportHeight = Math.round((viewport && viewport.height) || window.innerHeight || document.documentElement.clientHeight || 0);
      const baselineHeight = Math.round(Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, viewportHeight || 0));
      const nativeKeyboard = nativeKeyboardHeight();
      const availableViewportHeight = Math.max(0, viewportHeight - nativeKeyboard);
      const focused = document.activeElement === textarea;
      if (!focused && !document.body.classList.contains('keyboard-open')) {
        maxViewportHeight = baselineHeight;
      } else if (!document.body.classList.contains('keyboard-open')) {
        maxViewportHeight = Math.max(maxViewportHeight, baselineHeight);
      }
      const viewportShrink = Math.max(
        viewport ? Math.max(0, maxViewportHeight - viewportHeight) : 0,
        nativeKeyboard
      );
      const focusAge = focused && keyboardFocusStartedAt ? performance.now() - keyboardFocusStartedAt : Infinity;
      const previousShift = currentKeyboardShift();
      const keyboardOpen = focused && (viewportShrink > 80 || previousShift > 0 || keyboardShiftTarget > 0 || focusAge < 900);
      document.body.classList.toggle('keyboard-open', keyboardOpen);
      document.documentElement.style.setProperty('--app-top', '0px');
      document.documentElement.style.setProperty('--app-height', `${Math.max(maxViewportHeight, viewportHeight)}px`);
      if (!keyboardOpen || !availableViewportHeight) {
        keyboardShiftTarget = 0;
        document.documentElement.style.setProperty('--keyboard-shift', '0px');
        keepLayoutViewportPinned();
        return false;
      }

      if (viewportShrink <= 80) {
        document.documentElement.style.setProperty('--keyboard-shift', `${Math.round(keyboardShiftTarget || previousShift || 0)}px`);
        keepLayoutViewportPinned();
        return true;
      }

      const composerBottomWithoutShift = composer.getBoundingClientRect().bottom + previousShift;
      const desiredGapRaw = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--keyboard-composer-gap'));
      const desiredGap = Number.isFinite(desiredGapRaw) ? desiredGapRaw : 0;
      const maxReasonableShift = Math.max(180, maxViewportHeight * 0.46);
      const maxShift = Math.max(0, Math.min(viewportShrink + 24, maxReasonableShift));
      const measuredShift = clampNumber(composerBottomWithoutShift - availableViewportHeight + desiredGap, 0, maxShift);
      const shiftTrimRaw = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--keyboard-shift-trim'));
      const shiftTrim = nativeKeyboard > 0 ? 0 : (Number.isFinite(shiftTrimRaw) ? shiftTrimRaw : 36);
      const adjustedShift = clampNumber(measuredShift - shiftTrim, 0, maxShift);
      const nextShift = Math.max(keyboardShiftTarget, adjustedShift);
      keyboardShiftTarget = Math.round(nextShift);
      document.documentElement.style.setProperty('--keyboard-shift', `${keyboardShiftTarget}px`);
      keepLayoutViewportPinned();
      return true;
    }

    function readCompletedThreadIds() {
      try {
        const raw = JSON.parse(localStorage.getItem(THREAD_NOTICE_STORAGE_KEY) || '[]');
        const rows = Array.isArray(raw)
          ? raw.map(id => ({ id, at: 0 }))
          : Array.isArray(raw?.rows)
            ? raw.rows
            : Array.isArray(raw?.ids)
              ? raw.ids.map(id => ({ id, at: raw.at || 0 }))
              : [];
        const ids = new Set();
        completedThreadNoticeTimes = new Map();
        for (const row of rows) {
          const id = typeof row === 'string' ? row : row?.id;
          if (!id) continue;
          const rawAt = typeof row === 'string' ? 0 : row.at;
          const at = typeof rawAt === 'number' ? rawAt : Date.parse(rawAt || '') || 0;
          ids.add(id);
          completedThreadNoticeTimes.set(id, at);
        }
        return ids;
      } catch {
        completedThreadNoticeTimes = new Map();
        return new Set();
      }
    }

    function persistCompletedThreadIds() {
      const rows = [...completedThreadIds].map(id => ({
        id,
        at: completedThreadNoticeTimes.get(id) || Date.now(),
      }));
      localStorage.setItem(THREAD_NOTICE_STORAGE_KEY, JSON.stringify({ version: 2, rows }));
    }

    function isCompletedThreadNoticeExpired(id, now = Date.now()) {
      const at = Number(completedThreadNoticeTimes.get(id)) || 0;
      return !at || now - at > THREAD_NOTICE_MAX_AGE_MS;
    }

    function hasUnreadCompletedThread() {
      const knownThreadIds = new Set(knownThreads.map(item => item.id).filter(Boolean));
      const now = Date.now();
      for (const id of completedThreadIds) {
        if (!id || id === selectedThreadId) continue;
        if (isCompletedThreadNoticeExpired(id, now)) continue;
        if (knownThreadIds.size && !knownThreadIds.has(id)) continue;
        return true;
      }
      return false;
    }

    function pruneCompletedThreadNotices() {
      const knownThreadIds = new Set(knownThreads.map(item => item.id).filter(Boolean));
      const now = Date.now();
      let changed = false;
      for (const id of [...completedThreadIds]) {
        const runtime = threadRuntimeStates.get(id);
        if (id === selectedThreadId || isCompletedThreadNoticeExpired(id, now) || (knownThreadIds.size && !knownThreadIds.has(id)) || isThreadRunningStatus(runtime?.status)) {
          completedThreadIds.delete(id);
          completedThreadNoticeTimes.delete(id);
          changed = true;
        }
      }
      if (changed) persistCompletedThreadIds();
      updateTitleDotState();
    }

    function hasOtherRunningThread() {
      for (const [id, runtime] of threadRuntimeStates) {
        if (id && id !== selectedThreadId && isThreadRunningStatus(runtime?.status)) return true;
      }
      for (const item of knownThreads) {
        if (!item?.id || item.id === selectedThreadId) continue;
        const runtime = threadRuntimeStates.get(item.id) || runtimeSnapshotFromThread(item) || {};
        if (isThreadRunningStatus(runtime.status)) return true;
      }
      return false;
    }

    function isSelectedThreadRunning() {
      const runtime = selectedThreadId ? threadRuntimeStates.get(selectedThreadId) : null;

    function updateTitleDotState() {

      const otherRunning = hasOtherRunningThread();

      document.body.classList.remove('dot-working', 'dot-background-working', 'dot-attention');
      document.body.classList.toggle('dot-flashing', anyWorking);

    function isThreadRunningStatus(status) {
      return status === 'running' || status === 'waiting';
    }

    function isThreadCompleteStatus(status) {
      return status === 'complete' || status === 'error';
    }

    function clearLocalStopSuppression(threadId) {
      if (!threadId) return;
      locallyStoppedThreads.delete(threadId);
    }

    function markThreadLocallyStopped(threadId) {
      if (!threadId) return;
      const now = Date.now();
      locallyStoppedThreads.set(threadId, {
        at: now,
        until: now + LOCAL_STOP_SUPPRESS_MS,
      });
    }

    function isLocalStopSuppressed(threadId, startedAt = '') {
      if (!threadId) return false;
      const entry = locallyStoppedThreads.get(threadId);
      if (!entry) return false;
      if (Date.now() > entry.until) {
        locallyStoppedThreads.delete(threadId);
        return false;
      }
      const startedMs = Date.parse(startedAt || '');
      if (Number.isFinite(startedMs) && startedMs > entry.at + 1000) {
        locallyStoppedThreads.delete(threadId);
        return false;
      }
      return true;
    }

    function suppressRunningSnapshotAfterLocalStop(threadId, snapshot) {
      if (!snapshot || !isThreadRunningStatus(snapshot.status) || !isLocalStopSuppressed(threadId, snapshot.startedAt)) return snapshot;

        ...snapshot,
        status: 'idle',
        active: false,
        updatedAt: new Date().toISOString(),
      };
    }

    function setThreadCompleteNotice(threadId, active, completedAtMs = Date.now()) {
      if (!threadId) return;
      const before = completedThreadIds.has(threadId);
      const beforeAt = completedThreadNoticeTimes.get(threadId) || 0;
      if (active && threadId !== selectedThreadId) {
        completedThreadIds.add(threadId);
        completedThreadNoticeTimes.set(threadId, completedAtMs || Date.now());
      } else {
        completedThreadIds.delete(threadId);
        completedThreadNoticeTimes.delete(threadId);
      }
      if (before !== completedThreadIds.has(threadId) || beforeAt !== (completedThreadNoticeTimes.get(threadId) || 0)) persistCompletedThreadIds();
      updateTitleDotState();
    }

    function runtimeSnapshotFromThread(item) {
      if (!item) return null;
      const status = item.runtimeStatus || '';
      if (!status) return null;
      return {
        status,
        active: Boolean(item.runtimeActive || isThreadRunningStatus(status)),
        startedAt: item.runtimeStartedAt || '',
        completedAt: item.runtimeCompletedAt || '',
        updatedAt: item.runtimeUpdatedAt || item.effectiveUpdatedAt || item.updatedAt || '',
        turnId: item.runtimeTurnId || '',
      };
    }

    function applyThreadRuntimeState(threadId, snapshot, options = {}) {
      if (!threadId || !snapshot) return;
      snapshot = suppressRunningSnapshotAfterLocalStop(threadId, snapshot);
      const previous = threadRuntimeStates.get(threadId);
      threadRuntimeStates.set(threadId, snapshot);
      if (threadId === selectedThreadId) {
        setThreadCompleteNotice(threadId, false);
        return;
      }
      if (isThreadRunningStatus(snapshot.status)) {
        setThreadCompleteNotice(threadId, false);
        return;
      }
      if (!options.detectTransitions || !isThreadCompleteStatus(snapshot.status) || !previous) return;
      const wasRunning = isThreadRunningStatus(previous.status);
      const changedToComplete = previous.status !== snapshot.status && isThreadCompleteStatus(snapshot.status);
      const previousTime = Date.parse(previous.completedAt || previous.updatedAt || '') || 0;
      const currentTime = Date.parse(snapshot.completedAt || snapshot.updatedAt || '') || 0;
      const isRecentCompletion = Boolean(currentTime && Date.now() - currentTime <= THREAD_NOTICE_MAX_AGE_MS);
      if (isRecentCompletion && (wasRunning || changedToComplete || (currentTime && previousTime && currentTime > previousTime))) {
        setThreadCompleteNotice(threadId, true, currentTime);
      }
    }

    function formatDuration(ms = 0) {
      const total = Math.max(0, Math.floor(Math.max(0, Number(ms) || 0) / 1000));
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return minutes ? `${minutes}m ${seconds}s` : `${seconds}s`;
    }

    function setMetaLabel(meta, label = '') {
      if (!meta) return;
      const text = String(label || '');
      const match = text.match(/^(.*?)(\d+m\s+\d+s|\d+s)$/);
      meta.textContent = '';
      if (!match) {
        meta.textContent = text;
        return;
      }
      meta.append(document.createTextNode(match[1] || ''));
      const duration = match[2] || '';
      let cursor = 0;
      for (const digitMatch of duration.matchAll(/\d+/g)) {
        const index = digitMatch.index || 0;
        if (index > cursor) meta.append(document.createTextNode(duration.slice(cursor, index)));
        const number = document.createElement('span');
        number.className = 'meta-duration-number';
        number.textContent = digitMatch[0];
        meta.append(number);
        cursor = index + digitMatch[0].length;
      }
      if (cursor < duration.length) meta.append(document.createTextNode(duration.slice(cursor)));
    }

    function parseTimeMs(value) {
      const parsed = Date.parse(value || '');
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function setActiveRunStart(startedAt = '', fallbackMs = Date.now()) {
      if (!activeAssistant || activeAssistant.runStartedAtMs) return;
      const parsed = parseTimeMs(startedAt);
      const startMs = parsed || fallbackMs;
      activeAssistant.runStartedAtMs = startMs;
      activeAssistant.runStartedAt = new Date(startMs).toISOString();
    }

    function activeRunDurationMs(endAt = '') {
      if (!activeAssistant) return 0;
      const startMs = Number(activeAssistant.runStartedAtMs) || parseTimeMs(activeAssistant.runStartedAt);
      if (!startMs) return 0;
      const endMs = parseTimeMs(endAt) || Date.now();
      return Math.max(0, endMs - startMs);
    }

    function finalRunDurationMs(data = {}) {
      const serverDuration = Number(data.durationMs);
      if (Number.isFinite(serverDuration) && serverDuration >= 0) return serverDuration;
      const timestampDuration = activeRunDurationMs(data.completedAt || data.updatedAt || '');
      if (timestampDuration) return timestampDuration;
      return activeRunDurationMs();
    }

    function updateActiveRunDuration(force = false) {
      if (!activeAssistant) return;
      const durationText = formatDuration(activeRunDurationMs());
      if (!force && durationText === activeAssistant.runDurationText) return;
      activeAssistant.runDurationText = durationText;
      const activeCommandUi = commandUi(activeAssistant.commandKind || '');
      setMetaLabel(activeAssistant.meta, activeCommandUi ? activeCommandUi.runningLabel(durationText) : `Codex · 运行 ${durationText}`);
      setTopStatus(activeCommandUi ? activeCommandUi.runningNotice(durationText) : `Codex 正在回复 · ${durationText}`);
    }

    function startRunDurationTimer() {
      if (runDurationTimer) return;
      runDurationTimer = window.setInterval(() => updateActiveRunDuration(false), 1000);

    function stopRunDurationTimer() {

    function slashCommandTrigger() {
      if (activeWorkspace !== 'chat' || !textarea) return null;
      const value = textarea.value || '';
      const cursor = Number.isFinite(textarea.selectionStart) ? textarea.selectionStart : value.length;
      const before = value.slice(0, cursor);
      const after = value.slice(cursor);
      if (before.includes('\n') || (after && !/^\s*$/.test(after))) return null;
      const leadingTrimmed = value.trimStart();
      if (!leadingTrimmed.startsWith(SLASH_COMMAND_PREFIX)) return null;
      const slashIndex = value.indexOf(SLASH_COMMAND_PREFIX);
      const rawQuery = value.slice(slashIndex + 1).trim();
      if (rawQuery.includes(' ')) return null;
      return { slashIndex, query: rawQuery.toLowerCase() };
    }

    function slashCommandIcon(markup) {
      const span = workspaceElement('span', 'slash-command-icon');
      span.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${markup}</svg>`;

    }

    function closeSlashCommandMenu() {

    function renderSlashCommandMenu() {
      if (!slashCommandMenu) return;
      const trigger = slashCommandTrigger();
      if (!trigger) {
        closeSlashCommandMenu();
        return;
      }
      const query = trigger.query;
      const normalized = text => String(text || '').toLowerCase();
      slashCommandMatches = slashCommandItems().filter(item => {
        if (!query) return true;
        return normalized(item.key).includes(query) || normalized(item.label).includes(query) || normalized(item.detail).includes(query);
      });
      slashCommandOpen = true;
      slashCommandIndex = Math.max(0, Math.min(slashCommandIndex, slashCommandMatches.length - 1));
      slashCommandMenu.textContent = '';
      slashCommandMenu.classList.add('is-open');
      if (!slashCommandMatches.length) {
        slashCommandMenu.appendChild(workspaceElement('div', 'slash-command-empty', '没有匹配的命令'));
        return;
      }
      slashCommandMatches.forEach((item, index) => {
        const button = workspaceElement('button', `slash-command-item${index === slashCommandIndex ? ' is-active' : ''}`);
        button.type = 'button';
        button.setAttribute('role', 'option');
        button.setAttribute('aria-selected', String(index === slashCommandIndex));
        button.dataset.command = item.key;
        button.append(
          slashCommandIcon(item.icon),
          workspaceElement('span', 'slash-command-label', item.label),
          workspaceElement('span', 'slash-command-detail', item.detail),

    async function executeSlashCommand(commandKey) {
      const key = String(commandKey || slashCommandMatches[slashCommandIndex]?.key || '').trim();
      if (!key) return;
      clearSlashCommandText();
      closeSlashCommandMenu();
      if (key === 'mcp') {
        activePluginTab = 'mcp';
        openWorkspace('plugins');
        setNotice('已打开 MCP / 插件状态', 'ok');
      } else if (key === 'new') {
        await createNewThreadInCurrentProject();
      } else if (key === 'review') {
        await reviewCurrentThread();
      } else if (key === 'subtask') {
        await createNewThreadInCurrentProject();
        prefillComposer('副任务：');
        setNotice('已准备副任务输入', 'ok');
      } else if (key === 'compact') {
        await compactCurrentThread(selectedThreadId);
      } else if (key === 'feedback') {
        prefillComposer('反馈：');
        setNotice('写好反馈后点击发送', 'ok');
      } else if (key === 'continue') {
        await createNewThreadInCurrentProject();
        prefillComposer('继续这个任务：');
        setNotice('已在新任务里准备继续输入', 'ok');

        togglePetBuddy();

    function stepMarkdown(steps = []) {
      if (!steps.length) return '已发送，等待 Codex 开始回复…';
      return steps.map(step => {
        if (step.kind === 'tool') return `- **工具**：${step.text || ''}`;
        if (step.kind === 'thinking') return step.text || '正在分析请求';
        if (step.kind === 'start') return `- **开始**：${step.text || '开始处理'}`;
        if (step.kind === 'complete') return `- **完成**：${step.text || '回复完成'}`;
        if (step.kind === 'error') return `- **失败**：${step.text || 'Codex 回复失败'}`;
        return `- **${step.label || '事件'}**：${step.text || ''}`;
      }).join('\n\n');

    function renderProcessSteps(el, steps = []) {
      el._sourceMarkdown = '';

      el.replaceChildren();
      const feed = document.createElement('div');
      feed.className = 'process-feed';
      const progress = [...steps].reverse().find(step => step.kind === 'thinking' || step.kind === 'error');
      const status = document.createElement('div');
      status.className = `process-status-line${progress?.kind === 'error' ? ' is-error' : ''}`;
      if (progress?.kind !== 'error') {
        const activity = document.createElement('span');
        activity.className = 'process-activity';

        status.appendChild(activity);
      }
      status.appendChild(document.createTextNode(progress?.text || '正在处理请求'));

      const tools = steps.filter(step => step.kind === 'tool');
      if (tools.length) {
        const details = document.createElement('details');
        const summary = document.createElement('summary');

        details.className = 'process-tools';

    function addQueuedSend(text, attachments = [], state = 'sending', options = {}) {
      const id = `queued-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      queuedSends.push({ id, text, attachments: [...attachments], summary: queuedSendSummary(text, attachments), state, commandKind: options.commandKind || commandKindForText(text) });
      renderQueuedSends();
      return id;

    function updateQueuedSend(id, state = 'queued') {

      if (!item) return;
      item.state = state;

      queuedSends = queuedSends.filter(row => row.id !== id);

      const itemCommandKind = item.commandKind || commandKindForText(item.text);
      const itemCommandUi = commandUi(itemCommandKind);

    function appendImagesToBubble(message, attachments) {

    function wireMessageContextMenu(article, bubble, role) {
      if (role !== 'user' && role !== 'assistant') return;
      article.style.touchAction = 'manipulation';
      let timer = 0;
      let startPoint = null;
      let longPressOpened = false;
      const cancelTimer = () => { window.clearTimeout(timer); timer = 0; };
      const onPointerDown = event => {
        if (event.button > 0) return;
        startPoint = { x: event.clientX || 0, y: event.clientY || 0 };
        longPressOpened = false;
        cancelTimer();
        timer = window.setTimeout(() => {
          longPressOpened = true;
          vibrateForLongPress();
          openMessageContextMenu(article, bubble, role);
        }, 560);
      };
      const onPointerMove = event => {
        if (!startPoint) return;
        const dx = Math.abs((event.clientX || 0) - startPoint.x);
        const dy = Math.abs((event.clientY || 0) - startPoint.y);
        if (dx > 10 || dy > 10) cancelTimer();
      };
      const onPointerUp = () => { cancelTimer(); startPoint = null; };
      const onPointerCancel = () => { cancelTimer(); startPoint = null; };
      article.addEventListener('pointerdown', onPointerDown);
      article.addEventListener('pointermove', onPointerMove);
      article.addEventListener('pointerup', onPointerUp);
      article.addEventListener('pointercancel', onPointerCancel);
      article.addEventListener('contextmenu', event => {
        event.preventDefault();
        cancelTimer();
        startPoint = null;
        longPressOpened = false;
        vibrateForLongPress();
        openMessageContextMenu(article, bubble, role);
      });
      messageContextScrim.addEventListener('click', closeMessageContextMenu);
      messageContextScrim.addEventListener('pointerdown', event => event.preventDefault());
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeMessageContextMenu();
      });
    }

function addDetails(message, steps = [], liveUpdate = false) {
      const old = message.article.querySelector('details.process');
      if (old) old.remove();
      const normalizedSteps = Array.isArray(steps) ? steps.filter(step => step && (step.text || step.label)).slice(-500) : [];
      message.processSteps = normalizedSteps;
      message.article._processSteps = normalizedSteps;
      if (!normalizedSteps.length) return;
      const details = document.createElement('details');
      const summary = document.createElement('summary');
      const list = document.createElement('ul');
      details.className = 'process';
      details.open = true;
      list.className = 'steps';
      const groups = processGroups(normalizedSteps);
      summary.textContent = (liveUpdate ? '⏳ ' : '') + groups.map(group => processGroupLabel(group)).join(' · ');
      summary.title = '展开查看过程记录';
      let visibleCount = Math.min(4, normalizedSteps.length);
      const renderStepPage = () => {
        list.replaceChildren();
        for (const step of normalizedSteps.slice(-visibleCount)) {
          const li = document.createElement('li');
          const category = processStepCategory(step);
          li.className = `process-step-${category}`;
          li.textContent = step.text || step.label || '过程';
          list.appendChild(li);
        }
        const more = details.querySelector('.process-more');
        if (more) more.remove();
        if (visibleCount < normalizedSteps.length) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'process-more';
          button.textContent = `加载更多过程（${Math.min(4, normalizedSteps.length - visibleCount)} 条）`;
          button.addEventListener('click', event => {
            event.preventDefault();
            event.stopPropagation();
            visibleCount = Math.min(normalizedSteps.length, visibleCount + 4);
            renderStepPage();
          });
          details.appendChild(button);
        }
      };
      details.append(summary, list);

      message.article.querySelector('.bubble-wrap').appendChild(details);

    function processStepCategory(step = {}) {
      const category = String(step.category || '').toLowerCase();
      if (['browser', 'image', 'command', 'file', 'context', 'search'].includes(category)) return category;
      const text = `${step.label || ''} ${step.text || ''}`;
      if (/(?:浏览器|网页|页面|browser|chrome|tab|playwright)/i.test(text)) return 'browser';
      if (/(?:图片|图像|image|view_image)/i.test(text)) return 'image';
      if (/(?:命令|command|exec|shell|powershell|运行)/i.test(text)) return 'command';
      if (/(?:编辑|修改|文件|file|patch)/i.test(text)) return 'file';
      return 'tool';
    }

    function processCountText(count) {
      return Number(count) > 1 ? '多个' : String(Math.max(1, Number(count) || 1));
    }

    function processGroups(steps = []) {
      const groups = [];
      for (const step of steps) {
        const category = processStepCategory(step);
        const current = groups[groups.length - 1];
        if (current?.category === category) current.steps.push(step);
        else groups.push({ category, steps: [step] });
      }
      return groups;
    }

    function processGroupLabel(group = {}) {
      const count = Array.isArray(group.steps) ? group.steps.length : 0;
      const commandCount = count > 1 ? '多个命令' : `${count || 1} 个命令`;
      const operationCount = count > 1 ? '多个操作' : `${count || 1} 个操作`;
      if (group.category === 'browser') return `已使用浏览器运行了 ${commandCount}`;
      if (group.category === 'image') return `已查看 ${count || 1} 张图像`;
      if (group.category === 'command') return `运行了 ${commandCount}`;
      if (group.category === 'file') return `编辑了 ${count || 1} 个文件`;
      if (group.category === 'context') return '已压缩上下文';
      if (group.category === 'search') return `搜索了 ${processCountText(count)} 次`;
      return `运行了 ${operationCount}`;
    }

    function captureVisibleProcessSteps(message) {
      if (!message?.bubble) return [];
      if (Array.isArray(message.article?._processSteps) && message.article._processSteps.length) {
        return message.article._processSteps.slice(-500);
      }
      const steps = [];
      for (const node of [...message.bubble.querySelectorAll('.process-start, .process-complete, .process-error, .process-thinking, .process-tool')]) {
        const text = node.textContent.replace(/\s+/g, ' ').trim();
        if (!text) continue;
        let label = '过程';
        if (node.classList.contains('process-thinking')) label = '思考';
        else if (node.classList.contains('process-tool')) label = '工具';
        else if (node.classList.contains('process-start')) label = '开始';
        else if (node.classList.contains('process-complete')) label = '完成';
        else if (node.classList.contains('process-error')) label = '失败';
        steps.push({ label, text });
      }
      const plain = message.bubble.textContent.replace(/\s+/g, ' ').trim();
      if (!steps.length && plain && plain !== '已发送，等待 Codex 开始回复…' && plain !== 'Codex 正在回复…') {
        steps.push({ label: '已生成内容', text: plain });
      }
      return steps;
    }

    function officialDesktopPluginRows(plugins = []) {

        const row = byId.get(id);
        if (!row) continue;
        const key = String(row.name || row.id || '').toLowerCase();
        if (seenNames.has(key)) continue;
        seenNames.add(key);
        rows.push(row);

    function pluginMcpProviderRows(plugins = []) {

      const rows = [];
      for (const rule of PLUGIN_MCP_PROVIDER_RULES) {
        if (!installedIds.has(rule.id) || seen.has(rule.name)) continue;
        seen.add(rule.name);
        rows.push({ name: rule.name, enabled: true, source: 'plugin' });
      }
      return rows;
    }

    function marketplaceRows(plugins = []) {
      const available = plugins.filter(item => !item.installed);
      if (!available.length) return [];
      return [{
        name: 'Built by OpenAI',
        description: `${available.length} 个插件`,
        scope: '市场',
      }];
    }

    function pluginTabControls(counts = {}) {
      const controls = workspaceElement('div', 'workspace-plugin-controls');
      const tabs = workspaceElement('div', 'workspace-plugin-tabs');
      const tabRows = [
        ['plugins', '插件', counts.plugins || 0],
        ['mcp', 'MCP', counts.mcp || 0],
        ['market', '市场', counts.market || 0],
      ];
      for (const [key, label, count] of tabRows) {
        const button = workspaceElement('button', `workspace-plugin-tab${activePluginTab === key ? ' is-active' : ''}`, `${label} ${count}`);
        button.type = 'button';
        button.addEventListener('click', () => {
          activePluginTab = key;
          pluginSearchTerm = '';
          renderWorkspace();
        });
        tabs.appendChild(button);
      }
      const search = workspaceElement('label', 'workspace-plugin-search');
      search.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>';
      const input = document.createElement('input');
      input.type = 'search';
      input.autocomplete = 'off';
      input.placeholder = activePluginTab === 'mcp' ? '搜索 MCP 服务器' : activePluginTab === 'market' ? '搜索市场' : '搜索插件';
      input.value = pluginSearchTerm;
      input.addEventListener('input', () => {
        pluginSearchTerm = input.value || '';
        renderWorkspace();
      });
      search.appendChild(input);
      controls.append(tabs, search);
      return controls;

    function appendPluginSection(title, entries, kind) {
      if (!entries.length) return;
      const section = workspaceElement('section', 'workspace-section');
      if (title) section.appendChild(workspaceElement('h2', 'workspace-section-title', title));
      const list = workspaceElement('div', 'workspace-list');
      for (const entry of entries) {
        const detail = kind === 'plugins'
          ? [entry.marketplace, entry.category].filter(Boolean).join(' · ')
          : entry.description || '';
        const meta = kind === 'plugins'
          ? [entry.enabled ? '已启用' : entry.installed ? '已安装' : '可用', entry.version].filter(Boolean).join(' · ')
          : entry.enabled === false ? '已关闭' : entry.scope || '可用';
        const row = workspaceListRow({
          title: entry.name || entry.displayName || entry.id,
          detail,
          meta,
          className: kind === 'plugins' ? 'workspace-plugin-row' : 'workspace-plugin-row is-compact',
        });
        if (kind === 'plugins') {
          const mark = workspaceElement('span', 'workspace-plugin-mark');
          if (/^#[0-9a-f]{6}$/i.test(entry.brandColor || '')) mark.style.background = entry.brandColor;
          row.prepend(mark);
        }
        list.appendChild(row);
      }
      section.appendChild(list);
      workspaceContent.appendChild(section);
    }

    function renderPluginsWorkspace() {
      const data = workspaceData.plugins;
      workspaceContent.appendChild(workspaceHeading('插件'));
      if (workspaceLoading.has('plugins') && !data) {
        workspaceContent.appendChild(workspaceState('正在读取插件…'));
        return;
      }
      const error = renderWorkspaceError(data, 'plugins');
      if (error) workspaceContent.appendChild(error);
      const plugins = Array.isArray(data?.plugins) ? data.plugins : [];
      const officialPlugins = officialDesktopPluginRows(plugins);
      const mcpServers = Array.isArray(data?.mcpServers) ? data.mcpServers : [];
      const mcpProviders = pluginMcpProviderRows(plugins);
      const markets = marketplaceRows(plugins);
      workspaceContent.appendChild(pluginTabControls({
        plugins: officialPlugins.length,
        mcp: mcpServers.length,
        market: markets.length,
      }));

      if (activePluginTab === 'plugins') {
        const rows = filterWorkspaceRows(officialPlugins, entry => `${entry.name || ''} ${entry.description || ''} ${entry.marketplace || ''} ${entry.category || ''}`);
        appendPluginSection('已安装', rows, 'plugins');
        if (!rows.length) workspaceContent.appendChild(workspaceState(pluginSearchTerm ? '没有匹配的插件。' : '没有读取到已安装插件。'));
      } else if (activePluginTab === 'mcp') {
        const servers = filterWorkspaceRows(mcpServers, entry => `${entry.name || ''} ${entry.source || ''}`);
        const providers = filterWorkspaceRows(mcpProviders, entry => `${entry.name || ''} ${entry.source || ''}`);
        const toolbar = workspaceElement('div', 'workspace-toolbar');
        const addButton = workspaceElement('button', 'workspace-mcp-add', '+ 添加服务器');
        addButton.type = 'button';
        addButton.disabled = true;
        toolbar.appendChild(addButton);
        const header = workspaceElement('section', 'workspace-section');
        const title = workspaceElement('h2', 'workspace-section-title', '服务器');
        title.appendChild(toolbar);
        header.appendChild(title);
        workspaceContent.appendChild(header);
        appendPluginSection('', servers.map(server => ({
          name: server.name,
          description: '',
          scope: server.enabled === false ? '已关闭' : '已启用',
        })), 'skills');
        appendPluginSection('来自插件', providers.map(provider => ({
          name: provider.name,
          description: '',
          scope: '',

        if (!servers.length && !providers.length) workspaceContent.appendChild(workspaceState(pluginSearchTerm ? '没有匹配的 MCP 项。' : '没有读取到 MCP 服务器。'));
      } else if (activePluginTab === 'market') {
        const rows = filterWorkspaceRows(markets, entry => `${entry.name || ''} ${entry.description || ''}`);
        appendPluginSection('', rows, 'skills');
        if (!rows.length) workspaceContent.appendChild(workspaceState(pluginSearchTerm ? '没有匹配的市场。' : '没有读取到插件市场。'));
      }
    }

    function workspaceActionButton(label, handler, options = {}) {
      const button = workspaceElement('button', `workspace-row-action${options.primary ? ' is-primary' : ''}`, label);
      button.type = 'button';
      button.disabled = Boolean(options.disabled);
      button.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();
        handler?.();
      });
      return button;
    }

    function workspaceToggleNode(checked, handler, options = {}) {
      const label = workspaceElement('label', 'workspace-toggle');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = Boolean(checked);
      input.disabled = Boolean(options.disabled);
      input.addEventListener('change', event => {
        event.stopPropagation();
        handler?.(event.target.checked);
      });
      label.append(input, workspaceElement('span'));
      return label;
    }

            workspaceElement('h2', 'workspace-section-title', '环境详情'),
            workspaceActionButton('刷新', () => loadEnvironment({ force: true }))
          );
          environmentContent = workspaceElement('div', 'environment-settings-content');
          details.append(header, environmentContent);
          content.appendChild(details);
          if (environmentData) renderEnvironmentContent(environmentData);
          else loadEnvironment({ force: true });
        },
        worktrees: () => appendSettingsSection('工作树', [
          { title: '任务工作树', detail: knownThreads.length ? `已读取 ${knownThreads.length} 个任务，可按项目分组查看` : '正在等待任务列表', meta: '手机端' },
          { title: 'Git 工作树', detail: '创建和切换工作树需要在电脑端确认执行', meta: '电脑端管理' },
        ], content),
        archived: () => appendSettingsSection('已归档任务', [
          { title: '已归档任务', detail: '查看从手机端或桌面端归档过的任务', metaNode: workspaceActionButton('打开', () => openWorkspace('archived')) },
        ], content),
      };
      renderedCategory[activeSettingsCategory]();
    }

    function renderArchivedWorkspace() {
      const data = workspaceData.archived;
      workspaceContent.appendChild(workspaceHeading('已归档任务'));
      if (workspaceLoading.has('archived') && !data) {
        workspaceContent.appendChild(workspaceState('正在读取已归档任务…'));
        return;
      }
      const error = renderWorkspaceError(data, 'archived');
      if (error) workspaceContent.appendChild(error);
      const rows = Array.isArray(data?.threads) ? data.threads : [];
      if (!rows.length) {
        workspaceContent.appendChild(workspaceState('还没有归档任务。'));
        return;
      }
      const grouped = new Map();
      for (const row of rows) {
        const key = row.projectName || '对话';
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(row);
      }
      for (const [projectName, projectRows] of grouped.entries()) {
        const section = workspaceElement('section', 'workspace-section');
        section.appendChild(workspaceElement('h2', 'workspace-section-title', projectName));
        const list = workspaceElement('div', 'workspace-list');
        for (const row of projectRows) {
          list.appendChild(workspaceListRow({
            title: row.name || '未命名任务',
            detail: row.cwd || row.preview || row.id,
            meta: formatRelativeTime(row.effectiveUpdatedAt || row.updatedAt) || '已归档',
          }));
        }
        section.appendChild(list);
        workspaceContent.appendChild(section);
      }
    }

    function renderWorkspace() {
      if (activeWorkspace === 'chat') return;
      workspaceContent.innerHTML = '';
      if (activeWorkspace === 'pull-requests') renderPullRequestsWorkspace();
      else if (activeWorkspace === 'scheduled') renderScheduledWorkspace();
      else if (activeWorkspace === 'plugins') renderPluginsWorkspace();
      else if (activeWorkspace === 'settings') renderSettingsWorkspace();
      else if (activeWorkspace === 'archived') renderArchivedWorkspace();
    }

    function renderWorkspaceNavigation() {
      for (const button of drawerWorkspaceButtons) {
        button.setAttribute('aria-current', String(button.dataset.workspace === activeWorkspace));
      }
    }

    function openWorkspace(nextWorkspace, options = {}) {
      const next = WORKSPACE_TITLES[nextWorkspace] ? nextWorkspace : 'chat';
      const changed = activeWorkspace !== next;
      activeWorkspace = next;
      appShell.classList.toggle('is-workspace', next !== 'chat');
      thread.hidden = next !== 'chat';
      composerShell.hidden = next !== 'chat';
      workspacePanel.hidden = next === 'chat';
      renderWorkspaceNavigation();
      updateThreadTitle();
      if (next === 'chat') {
        workspaceErrors[activeWorkspace] = '';
        if (!options.keepDrawer) threadMenu.classList.remove('is-open');
        positionComposerSignature();
        return;
      }
      if (changed) scheduleFormOpen = false;
      if (!options.keepDrawer) threadMenu.classList.remove('is-open');
      renderWorkspace();
      loadWorkspaceData(next, { force: changed }).catch(() => {});
    }

    async function loadWorkspaceData(kind = activeWorkspace, options = {}) {
      if (kind === 'chat' || workspaceLoading.has(kind)) return;
      if (kind === 'settings') return loadSettingsWorkspaceData(options);
      const endpoint = {
        'pull-requests': '/codex/pull-requests',
        scheduled: '/codex/schedules',
        plugins: '/codex/plugins',
        archived: '/codex/archived',
      }[kind];
      if (!endpoint) return;
      workspaceLoading.add(kind);
      workspaceErrors[kind] = '';
      if (kind === activeWorkspace) renderWorkspace();
      try {
        const params = new URLSearchParams({ token });
        if (options.force) params.set('refresh', String(Date.now()));
        const response = await fetchApi(`${endpoint}?${params}`, { cache: 'no-store', apiTimeoutMs: kind === 'pull-requests' ? 30000 : 20000 });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) throw new Error(data.message || '读取工作区失败');
        workspaceData[kind] = data;
      } catch (error) {
        workspaceErrors[kind] = error.message || '读取工作区失败';
      } finally {
        workspaceLoading.delete(kind);
        if (kind === activeWorkspace) renderWorkspace();
      }
    }

    async function loadSettingsWorkspaceData(options = {}) {
      const kind = 'settings';
      if (workspaceLoading.has(kind)) return;
      workspaceLoading.add(kind);
      workspaceErrors[kind] = '';
      if (kind === activeWorkspace) renderWorkspace();
      try {
        const params = new URLSearchParams({ token });
        if (options.force) params.set('refresh', String(Date.now()));
        const [healthResponse, keepAwakeResponse, environmentResponse] = await Promise.all([
          fetchApi(`/codex/health?${params}`, { cache: 'no-store', apiTimeoutMs: 8000, routeSwitchQuiet: true }),
          fetchApi(`/codex/keep-awake?${params}`, { cache: 'no-store', apiTimeoutMs: 8000, routeSwitchQuiet: true }),
          fetchApi(`/codex/environment?${params}`, { cache: 'no-store', apiTimeoutMs: 18000, routeSwitchQuiet: true }),
        ]);
        const [health, keepAwake, environment] = await Promise.all([
          healthResponse.json().catch(() => ({})),
          keepAwakeResponse.json().catch(() => ({})),
          environmentResponse.json().catch(() => ({})),
        ]);
        if (!healthResponse.ok || !health.ok) throw new Error(health.message || '读取连接状态失败');
        if (keepAwakeResponse.ok && keepAwake.ok) {
          keepAwakeEnabled = Boolean(keepAwake.enabled);
          renderKeepAwakeButton();
        }
        if (environmentResponse.ok && environment.ok) environmentData = environment;
        workspaceData.settings = { health, keepAwake, environment };
        setRouteState('online', { controlMode: health.controlMode, host: health.host || '', error: '' });
      } catch (error) {
        workspaceErrors[kind] = error.message || '读取设置失败';
      } finally {
        workspaceLoading.delete(kind);
        if (kind === activeWorkspace) renderWorkspace();
      }
    }

    async function postScheduleAction(body) {
      const response = await fetchApi('/codex/schedules', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-mobile-typer-token': token },
        body: JSON.stringify(body),
        apiTimeoutMs: 30000,
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.message || '计划操作失败');
      workspaceData.scheduled = {
        ...(workspaceData.scheduled || {}),
        schedules: Array.isArray(data.schedules) ? data.schedules : [],
        projects: Array.isArray(data.projects) ? data.projects : workspaceData.scheduled?.projects || [],
      };
      workspaceErrors.scheduled = '';
      return data;
    }

    function formatRelativeTime(value) {
      const then = Date.parse(value || '');
      if (!Number.isFinite(then)) return '';
      const seconds = Math.max(0, Math.floor((Date.now() - then) / 1000));
      if (seconds < 60) return '刚刚';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes} 分钟`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours} 小时`;
      const days = Math.floor(hours / 24);
      if (days < 7) return `${days} 天`;
      const weeks = Math.floor(days / 7);
      if (weeks < 8) return `${weeks} 周`;
      const months = Math.floor(days / 30);
      if (months < 12) return `${months} 个月`;
      return `${Math.floor(days / 365)} 年`;
    }

    function sortThreadsByTime(items) {
      return [...items].sort((a, b) => (Date.parse(b.effectiveUpdatedAt || b.updatedAt || '') || b.effectiveUpdatedMs || 0) - (Date.parse(a.effectiveUpdatedAt || a.updatedAt || '') || a.effectiveUpdatedMs || 0));
    }

    function threadMenuStateForItem(item) {
      const runtime = threadRuntimeStates.get(item.id) || runtimeSnapshotFromThread(item) || {};
      if (isThreadRunningStatus(runtime.status)) return 'running';
      if (completedThreadIds.has(item.id) && item.id !== selectedThreadId) return 'done';
      return 'time';
    }

    function threadMenuVisualSignature() {
      const threadPart = [...knownThreads]
        .sort((a, b) => String(a.id || '').localeCompare(String(b.id || '')))
        .map(item => `${item.id}:${item.name || ''}:${item.pinned ? 'pinned' : 'normal'}:${threadMenuStateForItem(item)}`)
        .join('|');
      const openPart = [...openProjectKeys].sort().join(',');
      return `${selectedThreadId}::${threadSearchTerm}::${openPart}::${threadPart}`;
    }

    function renderThreadMenuIfVisualChanged() {
      if (threadMenuVisualSignature() !== lastThreadMenuSignature) renderThreadMenu();
    }

    function wireThreadMenuItemInteractions(button, item) {
      let timer = 0;
      let startPoint = null;
      let longPressOpened = false;
      let handledAt = 0;
      const cancel = () => {
        window.clearTimeout(timer);
        timer = 0;
        startPoint = null;
      };
      button.addEventListener('pointerdown', event => {
        if (event.button > 0) return;
        startPoint = { x: event.clientX || 0, y: event.clientY || 0 };
        longPressOpened = false;
        window.clearTimeout(timer);
        timer = window.setTimeout(() => {
          longPressOpened = true;
          handledAt = Date.now();
          clearNativeSelection();
          openThreadActionCard(item.id, { anchorElement: button, keepThreadMenu: true, vibrate: true });
        }, 560);
      });
      button.addEventListener('pointermove', event => {
        if (!startPoint) return;
        const dx = Math.abs((event.clientX || 0) - startPoint.x);
        const dy = Math.abs((event.clientY || 0) - startPoint.y);
        if (dx > 10 || dy > 10) cancel();
      });
      button.addEventListener('pointerup', event => {
        if (event.cancelable) event.preventDefault();
        event.stopPropagation();
        const shouldSelect = Boolean(startPoint && !longPressOpened);
        cancel();
        handledAt = Date.now();
        if (shouldSelect) selectThread(item.id);
      });
      button.addEventListener('pointercancel', cancel);
      button.addEventListener('contextmenu', event => {
        event.preventDefault();
        event.stopPropagation();
        cancel();
        handledAt = Date.now();
        clearNativeSelection();
        openThreadActionCard(item.id, { anchorElement: button, keepThreadMenu: true, vibrate: true });
      });
      button.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();
        if (Date.now() - handledAt < 700) return;
        selectThread(item.id);
      });
    }

    function appendThreadOption(parent, item, isConversation = false) {
      const button = document.createElement('button');
      const name = document.createElement('span');
      const state = document.createElement('span');
      const runtime = threadRuntimeStates.get(item.id) || runtimeSnapshotFromThread(item) || {};
      button.className = `thread-option${isConversation ? ' is-conversation' : ''}${item.pinned ? ' is-pinned' : ''}`;
      button.type = 'button';
      button.title = item.cwd || item.projectPath || item.name || '';
      button.setAttribute('aria-current', String(item.id === selectedThreadId));
      name.className = 'thread-option-title';
      state.className = 'thread-option-state';
      const text = document.createElement('span');
      text.className = 'thread-title-text';
      text.textContent = item.name || '未命名任务';
      if (item.pinned) {
        const pin = document.createElement('span');
        pin.className = 'thread-title-pin';
        pin.innerHTML = PIN_ICON;
        name.append(pin, text);
      } else {
        name.appendChild(text);
      }
      if (isThreadRunningStatus(runtime.status)) {
        const spinner = document.createElement('span');
        spinner.className = 'thread-option-spinner';
        spinner.setAttribute('aria-hidden', 'true');
        spinner.style.animationDelay = `${-(performance.now() % THREAD_SPINNER_MS)}ms`;
        state.title = '这个任务正在回复';
        state.setAttribute('aria-label', '正在回复');
        state.appendChild(spinner);
      } else if (completedThreadIds.has(item.id) && item.id !== selectedThreadId) {
        state.title = '这个任务刚刚回复完毕';
        state.setAttribute('aria-label', '刚刚回复完毕');
        state.innerHTML = '<span class="thread-option-dot" aria-hidden="true"></span>';
      } else {
        state.textContent = formatRelativeTime(item.effectiveUpdatedAt || item.updatedAt) || item.id.slice(0, 8);
      }
      button.append(name, state);
      wireThreadMenuItemInteractions(button, item);
      parent.appendChild(button);
    }

    function appendPinnedThreadOption(parent, item) {
      const button = document.createElement('button');
      const icon = document.createElement('span');
      const name = document.createElement('span');
      const meta = document.createElement('small');
      button.className = 'pinned-thread-option';
      button.type = 'button';
      button.title = item.cwd || item.projectPath || item.name || '';
      button.setAttribute('aria-current', String(item.id === selectedThreadId));
      icon.className = 'pinned-thread-icon';
      name.className = 'pinned-thread-name';
      meta.className = 'pinned-thread-meta';
      icon.innerHTML = PIN_ICON;
      name.textContent = item.name || '未命名任务';
      meta.textContent = formatRelativeTime(item.effectiveUpdatedAt || item.updatedAt) || '';
      button.append(icon, name, meta);
      wireThreadMenuItemInteractions(button, item);
      parent.appendChild(button);
    }

    function appendProjectGroup(parent, group, isCurrent = false) {
      const isOpen = openProjectKeys.has(group.key);
      const wrap = document.createElement('div');
      const header = document.createElement('button');
      const folder = document.createElement('span');
      const name = document.createElement('span');
      const count = document.createElement('small');
